name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Explicit bash enables pipefail, preserving test failures through tee.
defaults:
  run:
    shell: bash

# CI runners are dedicated to testing; local runs remain noninteractive by default.
env:
  DISPLAYPANEL_TEST_INTERACTIVE_UI: "1"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  signing-check:
    name: Check release signing identity and notary credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    env:
      DISPLAYPANEL_NOTARY_KEY_ID: ${{ secrets.DISPLAYPANEL_NOTARY_KEY_ID }}
      DISPLAYPANEL_NOTARY_ISSUER_ID: ${{ secrets.DISPLAYPANEL_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check signing identity import
        timeout-minutes: 2
        env:
          DISPLAYPANEL_SIGNING_P12_BASE64: ${{ secrets.DISPLAYPANEL_SIGNING_P12_BASE64 }}
          DISPLAYPANEL_SIGNING_P12_PASSWORD: ${{ secrets.DISPLAYPANEL_SIGNING_P12_PASSWORD }}
          DISPLAYPANEL_SIGNING_IDENTITY: ${{ secrets.DISPLAYPANEL_SIGNING_IDENTITY }}
        run: |
          export DISPLAYPANEL_SIGNING_KEYCHAIN="$RUNNER_TEMP/displaypanel-signing.keychain-db"
          echo "DISPLAYPANEL_SIGNING_KEYCHAIN=$DISPLAYPANEL_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          python3 scripts/import-signing.py
          cp /usr/bin/true "$RUNNER_TEMP/displaypanel-signing-probe"
          source scripts/signing.sh
          displaypanel_signing_configure
          displaypanel_sign "$RUNNER_TEMP/displaypanel-signing-probe" com.brettinternet.displaypanel.signing-probe
          codesign --verify --strict "$RUNNER_TEMP/displaypanel-signing-probe"
      - name: Write notary API key
        env:
          DISPLAYPANEL_NOTARY_KEY_BASE64: ${{ secrets.DISPLAYPANEL_NOTARY_KEY_BASE64 }}
        run: |
          if [[ -z "$DISPLAYPANEL_NOTARY_KEY_BASE64" ]]; then
            echo 'Notary API key secret is missing' >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/displaypanel-notary.p8"
          echo "DISPLAYPANEL_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          (umask 077 && base64 --decode <<<"$DISPLAYPANEL_NOTARY_KEY_BASE64" > "$key_path")
      - name: Check notary credentials without submitting
        timeout-minutes: 2
        env:
          DISPLAYPANEL_SIGNING_IDENTITY: ${{ secrets.DISPLAYPANEL_SIGNING_IDENTITY }}
          DISPLAYPANEL_REQUIRE_NOTARIZATION: "1"
        run: |
          source scripts/signing.sh
          displaypanel_signing_configure
          source scripts/notarize.sh
          displaypanel_notary_configure
          displaypanel_notary_check
      - name: Remove notary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/displaypanel-notary.p8"
      - name: Remove signing keychain
        if: always()
        run: python3 scripts/import-signing.py --cleanup

  test:
    name: Swift tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Lint compiler warnings
        run: swift build --disable-sandbox --build-tests -Xswiftc -warnings-as-errors
      - name: Run tests
        timeout-minutes: 5
        run: python3 scripts/test-ci.py 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.log
            test-stack-*.log
      - name: Check release version policy
        run: ./scripts/test-release-version.sh
      - name: Check signing policy (fake tools, no keys)
        run: python3 scripts/test-signing.py
      - name: Compile CLI product
        run: swift build --disable-sandbox --product dp
      - name: Compile app product
        run: swift build --disable-sandbox --product DisplayPanelApp

  release:
    name: Test and publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    env:
      DISPLAYPANEL_REQUIRE_SIGNING: "1"
      DISPLAYPANEL_SIGNING_IDENTITY: ${{ secrets.DISPLAYPANEL_SIGNING_IDENTITY }}
      DISPLAYPANEL_REQUIRE_NOTARIZATION: "1"
      DISPLAYPANEL_NOTARY_KEY_ID: ${{ secrets.DISPLAYPANEL_NOTARY_KEY_ID }}
      DISPLAYPANEL_NOTARY_ISSUER_ID: ${{ secrets.DISPLAYPANEL_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run tests
        timeout-minutes: 5
        run: python3 scripts/test-ci.py 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.log
            test-stack-*.log
      - name: Check signing policy (fake tools, no keys)
        run: python3 scripts/test-signing.py
      - name: Import release signing identity
        env:
          DISPLAYPANEL_SIGNING_P12_BASE64: ${{ secrets.DISPLAYPANEL_SIGNING_P12_BASE64 }}
          DISPLAYPANEL_SIGNING_P12_PASSWORD: ${{ secrets.DISPLAYPANEL_SIGNING_P12_PASSWORD }}
        run: |
          export DISPLAYPANEL_SIGNING_KEYCHAIN="$RUNNER_TEMP/displaypanel-signing.keychain-db"
          echo "DISPLAYPANEL_SIGNING_KEYCHAIN=$DISPLAYPANEL_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          python3 scripts/import-signing.py
      - name: Write notary API key
        env:
          DISPLAYPANEL_NOTARY_KEY_BASE64: ${{ secrets.DISPLAYPANEL_NOTARY_KEY_BASE64 }}
        run: |
          if [[ -z "$DISPLAYPANEL_NOTARY_KEY_BASE64" ]]; then
            echo 'Notary API key secret is missing' >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/displaypanel-notary.p8"
          echo "DISPLAYPANEL_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          (umask 077 && base64 --decode <<<"$DISPLAYPANEL_NOTARY_KEY_BASE64" > "$key_path")
      - name: Package, notarize and staple release
        timeout-minutes: 60
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Remove notary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/displaypanel-notary.p8"
      - name: Remove release signing keychain
        if: always()
        run: python3 scripts/import-signing.py --cleanup
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Downloads:
            - **DisplayPanel menu-bar app** — `DisplayPanel-….app.zip`
            - **Standalone dp CLI** — `dp-…-macos-universal.zip`

            Both archives are universal arm64/x86_64, Developer ID signed and notarized. The app is stapled; the CLI's first run checks its notarization online. Verify the matching SHA-256 checksum.
        run: |
          source scripts/release-version.sh
          release_version_parse "$GITHUB_REF_NAME"
          release_flags=()
          if [[ "$RELEASE_IS_PRERELEASE" == 1 ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          release_assets=(
            "dist/DisplayPanel-${GITHUB_REF_NAME}.app.zip#DisplayPanel menu-bar app (universal macOS)"
            "dist/DisplayPanel-${GITHUB_REF_NAME}.app.zip.sha256#DisplayPanel app SHA-256"
            "dist/dp-${GITHUB_REF_NAME}-macos-universal.zip#Standalone dp CLI (universal macOS)"
            "dist/dp-${GITHUB_REF_NAME}-macos-universal.zip.sha256#dp CLI SHA-256"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${release_assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              "${release_flags[@]}" \
              --notes "$RELEASE_NOTES" \
              --generate-notes
          fi
